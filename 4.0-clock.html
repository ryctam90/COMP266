<div id="content" class="content">

  <div id="container-clock" class="container-time-element" tabindex="0">
    <header><h1>Clock</h1></header>
    <div id="clock" class="time-element js-element">
      This is where the clock would go
    </div>
  </div>

  <div id="container-timer" class="container-time-element is-hidden" tabindex="0">
    <header><h1>Timer</h1></header>
    <div id="timer" class="time-element js-element">
      This is where the timer would go
    </div>
  </div>

  <div id="container-stopwatch" class="container-time-element is-hidden" tabindex="0">
    <header><h1>Stopwatch</h1></header>
      <div id="stopwatch" class="time-element">
        <div id="stopwatch-display" class="stopwatch-display">
          00:00:00.00
        </div>
        <div class="controls">
          <button id="start-btn-stopwatch">Start</button>
          <button id="resume-btn-stopwatch" class="is-hidden">Resume</button>
          <button id="stop-btn-stopwatch" class="is-hidden">Stop</button>
          <button id="reset-btn-stopwatch">Reset</button>
        </div>
      </div>
  </div>

  <nav class="other-time-tools">
    <button class="nav-btn is-active-button" data-target="container-clock">Clock</button>
    <button class="nav-btn" data-target="container-timer">Timer</button>
    <button class="nav-btn" data-target="container-stopwatch">Stopwatch</button>
  </nav>

</div>
