<div id="content" class="content">

  <div id="container-clock" class="container-time-tool" tabindex="0">
    <header><h1>Clock</h1></header>
    <div id="clock" class="time-tool js-element time-tool-display">
      This is where the clock would go
    </div>
  </div>

  <div id="container-timer" class="container-time-tool is-hidden" tabindex="0">
    <header><h1>Timer</h1></header>
    <div id="timer" class="time-tool">
      <div id="timer-display" class="time-tool-display">
        <input id="timer-input" placeholder="00:10:00" />
      </div>
      <div class="controls">
          <button id="start-btn-timer">Start</button>
          <button id="resume-btn-timer" class="is-hidden accentuate-bg">Resume</button>
          <button id="stop-btn-timer" class="is-hidden accentuate-bg">Pause</button>
          <button id="reset-btn-timer">Reset</button>
          <button id="mute-toggle">Mute</button>
          <button id="fullscreen-toggle">Fullscreen</button>
      </div>
    </div>
  </div>

  <div id="container-stopwatch" class="container-time-tool is-hidden" tabindex="0">
    <header><h1>Stopwatch</h1></header>
      <div id="stopwatch" class="time-tool">
        <div id="stopwatch-display" class="time-tool-display">
          00:00:00.00
        </div>
        <div class="controls">
          <button id="start-btn-stopwatch">Start</button>
          <button id="resume-btn-stopwatch" class="is-hidden accentuate-bg">Resume</button>
          <button id="stop-btn-stopwatch" class="is-hidden accentuate-bg">Stop</button>
          <button id="reset-btn-stopwatch">Reset</button>
        </div>
      </div>
  </div>

  <nav class="other-time-tools">
    <button class="nav-btn is-active-button" data-link="container-clock">Clock</button>
    <button class="nav-btn" data-link="container-timer">Timer</button>
    <button class="nav-btn" data-link="container-stopwatch">Stopwatch</button>
  </nav>

  <footer>Ricci Tam. Last modified 2026-10-16.</footer>

</div>
